version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: product-management-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: product_management_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d product_management_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: product-management-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      POSTGRES_DB_URL: jdbc:postgresql://postgres:5432/product_management_db
      DB_USERNAME: postgres
      DB_PASSWORD: root
      PORT: 8080
      JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      JWT_EXPIRATION_MS: 900000
      JWT_REFRESH_EXPIRATION_MS: 604800000

volumes:
  pgdata:
