# ==============================================================================
# Application Configuration - Product Management API
# ==============================================================================

# Server Configuration
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never

# Spring Configuration
spring:
  application:
    name: product-management-api

  # PostgreSQL Datasource Configuration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/product_management_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      pool-name: ProductManagementHikariPool

  # Spring Data JPA & Hibernate Configuration
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

# Swagger / OpenAPI Configuration (Springdoc)
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true

# JWT Security Configuration
app:
  jwt:
    # 256-bit hex/base64 secret key for HMAC-SHA256 signature
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    # Access Token expiration: 15 minutes (in milliseconds: 15 * 60 * 1000)
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
    # Refresh Token expiration: 7 days (in milliseconds: 7 * 24 * 60 * 60 * 1000)
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

# Logging Configuration
logging:
  level:
    root: INFO
    com.pooja.productmanagement: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"
